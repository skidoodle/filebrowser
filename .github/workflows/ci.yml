name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Frontend lint + build
        run: |
          bun install --frozen-lockfile --cwd frontend
          bun run --cwd frontend lint
          bun run --cwd frontend build

      - name: Go vet + test
        run: |
          go vet ./...
          go test -race ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

      - name: Production build (version-stamped)
        run: |
          VERSION=$(git describe --tags --always --dirty)
          COMMIT=$(git rev-parse --short HEAD)
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION} -X main.commit=${COMMIT}" -o bin/filebrowser .
